name: Repository integrity
on: [push, pull_request]
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test input and acquisition safeguards
        run: python -m unittest discover -s pipeline/tests -v
      - name: Verify published artifacts and documentation
        run: python tools/verify_repository.py
