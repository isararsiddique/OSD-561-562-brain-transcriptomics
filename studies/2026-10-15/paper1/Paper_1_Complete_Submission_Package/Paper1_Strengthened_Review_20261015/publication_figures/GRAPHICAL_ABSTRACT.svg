   <g id="text_21">
    <text style="font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: 700; font-size: 10px; font-family: 'Arial'; text-anchor: start" x="64.584" y="166.536" transform="rotate(-0 64.584 166.536)">c  Held-out prediction improves in all seven settings</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Arial'; text-anchor: start; fill: #183b49" x="19.872" y="22.712355" transform="rotate(-0 19.872 22.712355)">Stable prediction across spaceflight and Earth brain data</text>
  </g>
  <g id="text_23">
   <text style="font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: 700; font-size: 10px; font-family: 'Arial'; text-anchor: start" x="19.872" y="39.744" transform="rotate(-0 19.872 39.744)">a  Source data and experimental units</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9.5px; font-family: 'Arial'" transform="translate(19.872 72.075739)">Original: 7 deposits, 83 animals</text>
   <text style="font-size: 9.5px; font-family: 'Arial'" transform="translate(19.872 85.402272)">362 overlapping ground holdouts</text>
   <text style="font-size: 9.5px; font-family: 'Arial'" transform="translate(19.872 96.361228)"/>
   <text style="font-size: 9.5px; font-family: 'Arial'" transform="translate(19.872 112.476159)">External: 4 datasets, 64 held-out units</text>
   <text style="font-size: 9.5px; font-family: 'Arial'" transform="translate(19.872 125.57781)">46 individual animals + 18 pools</text>
  </g>
  <g id="text_25">
   <text style="font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: bold; font-weight: 700; font-size: 10px; font-family: 'Arial'; text-anchor: start" x="273.24" y="39.744" transform="rotate(-0 273.24 39.744)">b  Gain constrained regression</text>
  </g>
  <g id="text_26">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #187e72" transform="translate(273.24 72.070544)">Predict outside-sensor expression</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #187e72" transform="translate(273.24 85.446062)">Refit preprocessing within training folds</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #187e72" transform="translate(273.24 98.819353)">Select regularization by nested validation</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #187e72" transform="translate(273.24 109.734519)"/>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #187e72" transform="translate(273.24 125.893239)">16,084 certified convex fits</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #187e72" transform="translate(273.24 138.939226)">Correction operator gain ≤ 2</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #354d58" transform="translate(19.872 298.904152)">Bounded amplification and prediction gains are established here.</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #354d58" transform="translate(19.872 311.328)">Biological recovery and cross-context replication remain unproven.</text>
  </g>
